name: Database migrations

# Applies new files in supabase/migrations to production when they land on main.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF.
# Without them the job logs a notice and exits successfully, so it never blocks a deploy.
on:
  push:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/apply-migrations.mjs"
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Apply new migrations
        run: node scripts/apply-migrations.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
